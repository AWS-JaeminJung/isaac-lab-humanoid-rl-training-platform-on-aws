# Single Node, Single GPU (Spot Instance)
# Submit: curl -X POST /api/pool/eks-gpu-robotics/workflow  (platform: spot)
workflow:
  name: h1-single-gpu-spot
  tasks:
  - name: train-h1
    image: 031273582910.dkr.ecr.us-east-1.amazonaws.com/isaac-lab-training:latest
    command:
    - bash
    - -c
    - |
      cd /workspace/isaaclab
      mkdir -p /isaac-sim/kit/data/Kit/Isaac-Sim/5.0/pip3-envs/default
      export WARP_LOG_LEVEL=error
      /isaac-sim/python.sh -c "
      import os, sys, subprocess, re, time, mlflow

      TRACKING_URI = 'http://mlflow-tracking.mlflow.svc/mlflow'
      WORKFLOW_NAME = 'h1-single-gpu-spot'
      WORKFLOW_ID = os.environ.get('OSMO_WORKFLOW_ID', WORKFLOW_NAME)
      TASK = 'Isaac-Velocity-Rough-H1-v0'
      NUM_ENVS = 2048
      MAX_ITERATIONS = 10

      print('=' * 60)
      print('[STEP 1/4] Environment Setup')
      print('=' * 60)
      t0 = time.time()
      print(f'  Workflow: {WORKFLOW_ID}')
      print(f'  Task: {TASK}, Envs: {NUM_ENVS}, Iters: {MAX_ITERATIONS}')
      print(f'  Config: 1 GPU, Spot Instance')
      mlflow.set_tracking_uri(TRACKING_URI)
      mlflow.set_experiment(WORKFLOW_NAME)

      with mlflow.start_run(run_name=WORKFLOW_ID):
          mlflow.log_params({
              'task': TASK, 'num_envs': NUM_ENVS,
              'max_iterations': MAX_ITERATIONS,
              'algorithm': 'PPO', 'framework': 'rsl_rl',
              'num_gpus': 1, 'capacity_type': 'spot',
              'workflow_id': WORKFLOW_ID,
          })
          mlflow.set_tag('capacity_type', 'spot')

          print('=' * 60)
          print('[STEP 2/4] Training')
          print('=' * 60)
          t1 = time.time()

          cmd = ['/isaac-sim/python.sh',
              'scripts/reinforcement_learning/rsl_rl/train.py',
              f'--task={TASK}', f'--num_envs={NUM_ENVS}',
              f'--max_iterations={MAX_ITERATIONS}', '--headless']

          process = subprocess.Popen(cmd, stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT, universal_newlines=True, bufsize=1)

          iteration = 0
          for line in process.stdout:
              print(line, end='')
              if 'Mean reward' in line:
                  m = re.search(r'Mean reward:\s*([-\d.]+)', line)
                  if m: mlflow.log_metric('mean_reward', float(m.group(1)), step=iteration)
              if 'Mean episode length' in line:
                  m = re.search(r'Mean episode length:\s*([-\d.]+)', line)
                  if m: mlflow.log_metric('mean_episode_length', float(m.group(1)), step=iteration)
              if 'Iteration time' in line:
                  m = re.search(r'Iteration time:\s*([\d.]+)', line)
                  if m:
                      mlflow.log_metric('iteration_time_sec', float(m.group(1)), step=iteration)
                      iteration += 1

          process.wait()
          mlflow.log_metric('exit_code', process.returncode)
          mlflow.log_metric('training_time_sec', time.time() - t1)

          print('=' * 60)
          print('[STEP 3/4] MLflow Upload')
          print('=' * 60)

          import torch, shutil, glob, tempfile
          log_dir = 'logs/rsl_rl/h1_rough'
          if os.path.exists(log_dir):
              runs = sorted(os.listdir(log_dir))
              if runs:
                  model_dir = os.path.join(log_dir, runs[-1])
                  files = os.listdir(model_dir)
                  print(f'  Found {len(files)} files in {model_dir}')
                  pt_files = sorted(glob.glob(os.path.join(model_dir, 'model_*.pt')))
                  if pt_files:
                      best_ckpt = pt_files[-1]
                      print(f'  Uploading: {best_ckpt}')
                      staging = tempfile.mkdtemp()
                      shutil.copy2(best_ckpt, staging)
                      with open(os.path.join(staging, 'MLmodel'), 'w') as mf:
                          mf.write(f'artifact_path: model\nflavors:\n  pytorch:\n    model_data: {os.path.basename(best_ckpt)}\n    pytorch_version: {torch.__version__}\nmodel_size_bytes: {os.path.getsize(best_ckpt)}\n')
                      mlflow.log_artifacts(staging, artifact_path='model')
                  else:
                      mlflow.log_artifacts(model_dir, artifact_path='model')
                  for f in files:
                      fpath = os.path.join(model_dir, f)
                      if not f.endswith('.pt') and os.path.isfile(fpath):
                          mlflow.log_artifact(fpath, artifact_path='model/extras')
                  osmo_out = '/osmo/data/output/model'
                  os.makedirs(osmo_out, exist_ok=True)
                  for f in files:
                      src, dst = os.path.join(model_dir, f), os.path.join(osmo_out, f)
                      if os.path.isdir(src): shutil.copytree(src, dst, dirs_exist_ok=True)
                      else: shutil.copy2(src, dst)
                  try:
                      mlflow.register_model(f'runs:/{mlflow.active_run().info.run_id}/model', WORKFLOW_NAME)
                      print(f'  Model registered: {WORKFLOW_NAME}')
                  except Exception as e:
                      print(f'  Registration skipped: {e}')
          else:
              print(f'  WARNING: {log_dir} not found')

          print('=' * 60)
          print('[STEP 4/4] Done')
          print('=' * 60)
          total = time.time() - t0
          mlflow.log_metric('total_duration_sec', total)
          print(f'  MLflow run: {mlflow.active_run().info.run_id}')
          print(f'  Duration: {total:.1f}s')
      "
    resources:
      cpu: 4
      memory: 16Gi
      gpu: 1
      storage: 50Gi
